<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);

<script>
  (function () {
    'use strict';

    var navigationPending = false;

    function announceNavigation(message, isError) {
      var status = document.getElementById('navigation-status');
      if (!status) {
        status = document.createElement('div');
        status.id = 'navigation-status';
        status.setAttribute('role', isError ? 'alert' : 'status');
        status.setAttribute('aria-live', isError ? 'assertive' : 'polite');
        status.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:9999;max-width:360px;padding:12px 16px;border-radius:8px;background:#20242b;color:#e9ecf1;border:1px solid #46505d;';
        document.body.appendChild(status);
      }
      status.setAttribute('role', isError ? 'alert' : 'status');
      status.textContent = message;
    }

    /** Navega para outra página do app via roteador server-side (Main.doGet). */
    window.navigateTo = function (page) {
      if (navigationPending) return;
      if (!page || !/^[A-Za-z][A-Za-z0-9_-]*$/.test(String(page))) {
        announceNavigation('Destino de navegação inválido.', true);
        return;
      }
      if (!window.google || !google.script || !google.script.run) {
        window.top.location.href = '?page=' + encodeURIComponent(page);
        return;
      }
      navigationPending = true;
      document.documentElement.setAttribute('aria-busy', 'true');
      announceNavigation('Abrindo página…', false);
      var token = window.ApiClient && window.ApiClient.getAuthToken
        ? window.ApiClient.getAuthToken()
        : (new URLSearchParams(window.location.search).get('tok') || '');
      google.script.run
        .withSuccessHandler(function (url) {
          if (url) { window.top.location.href = url; return; }
          navigationPending = false;
          document.documentElement.removeAttribute('aria-busy');
          announceNavigation('Não foi possível localizar essa página.', true);
        })
        .withFailureHandler(function (err) {
          navigationPending = false;
          document.documentElement.removeAttribute('aria-busy');
          console.error('navigateTo falhou:', err);
          announceNavigation('Não foi possível abrir a página. Tente novamente.', true);
        })
        .getPageUrl(page, token);
    };

    /** Encerra a sessão e redireciona para o Login. */
    window.logout = function () {
      announceNavigation('Encerrando sessão…', false);
      var finish = function () {
        window.sessionStorage.removeItem('wayToGoAuthToken');
        google.script.run
          .withSuccessHandler(function (url) {
            if (url) window.top.location.href = url;
          })
          .getPageUrl('Login');
      };
      if (window.ApiClient) {
        window.ApiClient.call('AuthService', 'logout', {}, { loading: false })
          .then(finish).catch(function () {
            announceNavigation('Não foi possível confirmar o encerramento da sessão. Tente sair novamente.', true);
          });
      } else {
        announceNavigation('Não foi possível confirmar o encerramento da sessão. Recarregue a página e tente sair novamente.', true);
      }
    };

     * Chamada padronizada ao backend que entende o envelope ApiResponse.
     * @param {string} fn       Nome da função server-side.
     * @param {Array=}  args    Argumentos.
     * @param {Function=} onOk  Recebe `data` (em sucesso).
     * @param {Function=} onErr Recebe o envelope/erro (em falha).

    window.callServer = function (fn, args, onOk, onErr) {
      onOk = onOk || function () {};
      onErr = onErr || function (e) { alert((e && (e.message || e.error)) || 'Erro inesperado.'); };

        .withFailureHandler(onErr);
      runner[fn].apply(runner, args || []);
    };
  })();
